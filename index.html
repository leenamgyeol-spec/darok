:root {
  --bg: #F5F1E8; --bg2: #EBE6DA; --paper: #FAF7F0; --fg: #262B24; --fg2: #5E6658; --fg3: #8A9184;
  --deep: #253C30; --sage: #879A82; --brown: #876444; --line: #D9D2C2; --line2: #C9C0AC;
  --star: #A97A3A; --danger: #9A3B2E; --ok: #4E7A52; --shadow: 0 1px 2px rgba(38,43,36,.06), 0 8px 24px rgba(38,43,36,.07);
  --f-display: 'Noto Serif KR', 'Nanum Myeongjo', 'AppleMyungjo', 'Batang', serif;
  --f-body: 'IBM Plex Sans KR', 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --f-han: 'Noto Serif TC', 'Noto Serif JP', 'Noto Serif KR', serif;
  --f-num: 'IBM Plex Sans KR', system-ui, sans-serif;
  --r: 10px; --nav: 232px; --ease: cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111814; --bg2: #18211C; --paper: #151E19; --fg: #E6E8DF; --fg2: #9BA89B; --fg3: #6F7C70;
  --deep: #A2B89C; --sage: #7F947B; --brown: #C49A70; --line: #26322B; --line2: #33423A;
  --star: #D2A562; --danger: #D07A6B; --ok: #8DBB8F; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111814; --bg2: #18211C; --paper: #151E19; --fg: #E6E8DF; --fg2: #9BA89B; --fg3: #6F7C70;
  --deep: #A2B89C; --sage: #7F947B; --brown: #C49A70; --line: #26322B; --line2: #33423A;
  --star: #D2A562; --danger: #D07A6B; --ok: #8DBB8F; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3); color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
.cat-head:has(.fpanel:not([hidden])) { position: static; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.65; -webkit-font-smoothing: antialiased;
  background-image: radial-gradient(ellipse at 20% 0%, color-mix(in srgb, var(--paper) 70%, transparent), transparent 60%); background-attachment: fixed; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--deep); }
:focus-visible { outline: 2px solid var(--brown); outline-offset: 2px; border-radius: 4px; }
.han { font-family: var(--f-han); font-weight: 500; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--fg2); } .faint { color: var(--fg3); }
.ico { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico.sm { width: 16px; height: 16px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ── 셸 ── */
.shell { min-height: 100%; }
.side { position: fixed; inset: 0 auto 0 0; width: var(--nav); border-right: 1px solid var(--line); padding: 28px 18px 20px max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 28px; background: var(--bg); z-index: 20; }
.mast { display: flex; gap: 14px; align-items: flex-start; padding-left: 6px; }
.mast .v { writing-mode: vertical-rl; font-family: var(--f-han); font-size: 34px; letter-spacing: .18em; line-height: 1; color: var(--deep); font-weight: 600; }
.mast .t { display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
.mast .t b { font-family: var(--f-display); font-weight: 600; font-size: 19px; letter-spacing: .02em; }
.mast .t small { font-size: 10.5px; letter-spacing: .28em; color: var(--fg3); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: var(--fg2); text-align: left; transition: background .2s, color .2s; }
.nav button:hover { background: var(--bg2); color: var(--fg); }
.nav button[aria-current="page"] { color: var(--deep); background: var(--bg2); font-weight: 600; }
.side .add { margin-top: auto; display: flex; align-items: center; gap: 10px; justify-content: center; padding: 11px; border: 1px solid var(--line2); border-radius: 999px; color: var(--deep); font-weight: 500; }
.side .add:hover { background: var(--bg2); }

      secondaryCategories: o.sc || [], country, region: region || '', brewProfile: bp || null,
      aliases: o.al || [], tags: o.tg || [], kind: o.kind || 'tea', parent: o.par || null,

    };

  };

  function vLog() {

  function collection() {
    let pool;
    const r = (t) => S.ratings[t.id];
    switch (S.mine.tab) {
      case 'five': pool = ALL.filter((t) => r(t) && r(t).v === 5); break;
      case 'four': pool = ALL.filter((t) => r(t) && r(t).v >= 4); break;
      case 'fav': pool = ALL.filter((t) => S.favorites[t.id]); break;
      case 'brewed': pool = ALL.filter((t) => S.brewed[t.id]).sort((a, b) => S.brewed[b.id].t - S.brewed[a.id].t); break;
      case 'shared': { const has = (id) => S.others.some((o) => o.ratings[id] || o.notes[id]); const best = (id) => Math.max(0, ...S.others.map((o) => (o.ratings[id] ? o.ratings[id].v : 0))); const sp = ALL.filter((t) => has(t.id)).sort((a, b) => (best(b.id) - best(a.id)) || a.nameKo.localeCompare(b.nameKo, 'ko')); return sp.length ? sp.map((t) => itemRow(t) + S.others.filter((o) => o.ratings[t.id] || o.notes[t.id]).map((o) => `<p class="sharednote"><b>${esc(o.owner)}</b>${o.ratings[t.id] ? ' ★ ' + o.ratings[t.id].v.toFixed(1) : ''}${o.notes[t.id] ? ' — ' + esc(o.notes[t.id].text) : ''}</p>`).join('')).join('') : `<div class="empty">${S.others.length ? '공유된 기록이 없습니다.' : '불러온 다른 사람의 기록이 없습니다. 설정의 "다른 사람 기록 보기"에서 기록 링크를 추가하십시오.'}</div>`; }
      case 'recent': pool = ALL.filter(r).sort((a, b) => r(b).t - r(a).t).slice(0, 30); break;
      case 'unrated': pool = ALL.filter((t) => !r(t)); break;
      case 'all': pool = ALL.slice(); break;
      default: pool = ALL.filter(r);
    }
    const sorters = {
      rating: (a, b) => ((r(b) || { v: -1 }).v - (r(a) || { v: -1 }).v) || a.nameKo.localeCompare(b.nameKo, 'ko'),
      name: (a, b) => a.nameKo.localeCompare(b.nameKo, 'ko'),

    const cap = pool.slice(0, 200);
    return cap.map((t) => itemRow(t)).join('') + (pool.length > 200 ? `<p class="faint" style="font-size:13px;margin-top:10px">${pool.length}개 중 200개를 표시했습니다. 전체 목록은 차 도감의 필터를 이용하십시오.</p>` : '');
  }
  function flavorPref(rated) {

    return D.flavorKeys.map(([k, l]) => ({ k, l, hi: avg(hi, k), all: avg(all, k), base: avg(D.teas.filter((t) => t.flavor), k) }));
  }
  let BASEFLV = null;
  function insights(rated, byCat, mostCat, top) {
    if (!rated.length) return `<div class="empty">별점을 남기면 실제 기록을 바탕으로 취향을 정리해 드립니다.</div>`;

    if (mostCat) out.push(`가장 많이 평가한 종류는 ${esc(mostCat[0])}(${mostCat[1].n}종)예요.`);
    if (top) out.push(`지금까지 가장 높은 평가를 받은 차는 ${esc(top.nameKo)}(${S.ratings[top.id].v.toFixed(1)}점)예요.`);
    const fp = flavorPref(rated);
    if (fp) { const d = fp.map((x) => ({ ...x, diff: x.hi - x.base })).sort((a, b) => b.diff - a.diff)[0]; if (d.diff > 0.4) out.push(`4점 이상을 준 차들은 수록된 차 전체 평균보다 ${esc(d.l)}이 뚜렷한 경우가 많아요.`); }

  }
  function chartsHtml(rated, byCat, byCountry) {
    const cats = Object.entries(byCat).map(([k, v]) => [k, v.sum / v.n, v.n, v.c]).sort((a, b) => b[1] - a[1]);
    const ctr = Object.entries(byCountry).sort((a, b) => b[1] - a[1]).slice(0, 8);
    const maxC = Math.max(1, ...ctr.map((x) => x[1]));
    const fp = flavorPref(rated);
    const dist = Array(10).fill(0); rated.forEach((t) => { dist[Math.round(S.ratings[t.id].v * 2) - 1]++; });
    const maxD = Math.max(1, ...dist);
    return `<div class="chart"><h4>종류별 평균 별점</h4>${cats.map(([k, a, n, c]) => `<div class="hbar"><span>${esc(k)}</span><span class="tr"><i style="width:${a / 5 * 100}%;--c:${c}"></i></span><span class="v">${a.toFixed(1)} <span class="faint">(${n})</span></span></div>`).join('')}<p class="disclaim">막대 끝은 5.0점 기준입니다. 괄호는 평가 개수.</p></div>
      <div class="chart"><h4>국가별 평가 개수</h4>${ctr.map(([k, n]) => `<div class="hbar"><span>${esc(k)}</span><span class="tr"><i style="width:${n / maxC * 100}%;--c:var(--brown)"></i></span><span class="v">${n}</span></div>`).join('')}</div>
      <div class="chart"><h4>향미별 선호도 <span class="faint" style="font-weight:400">— 4점 이상 차의 평균 향미</span></h4>${fp ? fp.map((x) => `<div class="hbar"><span>${x.l}</span><span class="tr"><i style="width:${x.hi / 5 * 100}%;--c:var(--sage)"></i></span><span class="v">${x.hi.toFixed(1)}</span></div>`).join('') + '<p class="disclaim">0~5 참고용 향미 프로필의 평균입니다.</p>' : '<p class="muted">4점 이상을 준 차가 생기면 표시됩니다.</p>'}</div>
      <div class="chart"><h4>내 별점 분포</h4><div class="hist">${dist.map((d) => `<i style="height:${d / maxD * 100}%">${d ? `<span>${d}</span>` : ''}</i>`).join('')}</div><div class="histx">${dist.map((_, i) => `<span>${((i + 1) / 2).toFixed(1)}</span>`).join('')}</div></div>`;
  }
  function recsHtml(rated) {
    const liked = rated.filter((t) => S.ratings[t.id].v >= 4).sort((a, b) => S.ratings[b.id].v - S.ratings[a.id].v).slice(0, 6);
    if (!liked.length) return `<div class="empty">4점 이상을 준 차가 생기면, 비슷한 계열·향미·산지의 아직 평가하지 않은 차를 추천합니다.</div>`;
    const unrated = ALL.filter((t) => !S.ratings[t.id]);
    const seen = new Set(), recs = [];
    for (const l of liked) {
      for (const r of similarTo(l, 4, unrated)) { if (seen.has(r.t.id)) continue; seen.add(r.t.id); recs.push({ ...r, from: l }); if (recs.length >= 8) break; }
      if (recs.length >= 8) break;

  function qualityReport() {
    const kind = {}, cat = {}; let teaBrew = 0;
    const names = {}, dupNames = [], badTemp = [], noDesc = [], matchaLeaf = [], noCat = [];
    D.teas.forEach((t) => {
      kind[t.kind] = (kind[t.kind] || 0) + 1; cat[t.primaryCategory] = (cat[t.primaryCategory] || 0) + 1;
      if (t.brewOverride && Object.keys(t.brewOverride).length) teaBrew++;
      [t.nameKo].concat(t.aliases).forEach((n) => { const k = norm(n); if (!k) return; (names[k] = names[k] || new Set()).add(t.id); });
      const b = D.getBrew(t);
      for (const [k, m] of Object.entries(b.methods)) { const tt = m.t || (m.usu && m.usu.t); if (tt && (tt[0] > tt[1] || tt[1] > 100 || (tt[0] < 40 && k !== 'x'))) badTemp.push(t.nameKo + '(' + k + ')'); }
      if ((t.secondaryCategories || []).includes('powder') && (b.methods.w || b.methods.g)) matchaLeaf.push(t.nameKo);
      if (t.kind === 'tea' && !t.description) noDesc.push(t.nameKo);
      if (!t.primaryCategory || !t.nameKo) noCat.push(t.id);
    });
    const exactNameDup = {}; D.teas.forEach((t) => { const k = norm(t.nameKo); exactNameDup[k] = (exactNameDup[k] || 0) + 1; });
    const nameDup = Object.entries(exactNameDup).filter(([, n]) => n > 1).map(([k]) => k);
    const shared = Object.entries(names).filter(([, s]) => s.size > 1).map(([k, s]) => k + '→' + [...s].length + '개 항목');
    const checks = [
      { label: '중복 ID 없음', ok: !D.errors.some((e) => e.startsWith('중복')), detail: D.errors.filter((e) => e.startsWith('중복')).join(', ') },
      { label: '분류·우림 프로필 연결 오류 없음', ok: !D.errors.some((e) => !e.startsWith('중복')), detail: D.errors.filter((e) => !e.startsWith('중복')).join(', ') },
      { label: '같은 한국어 이름의 중복 등록 없음', ok: !nameDup.length, detail: nameDup.join(', ') },
      { label: '여러 항목이 함께 쓰는 별칭', ok: true, detail: shared.length ? shared.length + '개 (예: ' + shared.slice(0, 4).join(', ') + ') — 계열명·통칭이라 의도된 경우가 많습니다' : '없음' },
      { label: '물 온도 범위가 상식적(40~100℃, 최저≤최고)', ok: !badTemp.length, detail: badTemp.join(', ') },
      { label: '말차·분말차에 잎차 우림법 미적용', ok: !matchaLeaf.length, detail: matchaLeaf.join(', ') },
      { label: '개별 차 모두 설명 있음', ok: !noDesc.length, detail: noDesc.join(', ') },
      { label: '모든 항목에 이름·분류 있음', ok: !noCat.length, detail: noCat.join(', ') },
      { label: '단위 일관성(℃·g·ml·초)', ok: true, detail: '모든 우림 수치는 같은 단위 체계로 저장됩니다' }
    ];
    return { kind, cat, teaBrew, checks };
  }

    const vOpts = (cur) => `<option value="">별점 없음</option>` + STARS.map((v) => `<option value="${v}"${cur === v ? ' selected' : ''}>★ ${v.toFixed(1)}</option>`).join('');
    async function call(path, body) {
      let r;
      try { r = await fetch(BOARD_URL + path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : { cache: 'no-store' }); }
      catch (e) { throw new Error('리뷰 서버에 연결하지 못했습니다. 인터넷 연결을 확인하십시오.'); }
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || '리뷰 서버에서 오류가 났습니다 (' + r.status + ').');
      return j;
    }
    function draw(force) {
      if (!['detail', 'reviews', 'home', 'settings', 'admin'].includes(S.view.name)) return;
      if (!force && document.activeElement && /input|textarea|select/i.test(document.activeElement.tagName)) return;
      const y = window.scrollY; render(); window.scrollTo(0, y);
    }
    async function load() {
      if (!BOARD_URL || st.loading) return;
      st.loading = true;
      try { const j = await call('/reviews'); st.list = (j.reviews || []).filter((r) => r && typeof r.id === 'string' && typeof r.teaId === 'string'); st.err = ''; }
      catch (e) { st.err = e.message; }
      st.loading = false; st.loaded = true; draw();
    }
    const fmtWhen = (r) => `<time datetime="${new Date(r.t).toISOString()}" title="${esc(new Date(r.t).toLocaleString('ko-KR'))}">${new Date(r.t).toLocaleDateString('ko-KR')} · ${ago(r.t)}${r.edited ? ' · 수정됨' : ''}</time>`;
    function cardHtml(r, withTea) {
      const t = tea(r.teaId), mode = st.edit && st.edit.id === r.id ? st.edit.mode : '';
      const body = mode === 'edit'
        ? `<form class="bform" data-bedit-form="${esc(r.id)}">
            <div class="bf-row"><label class="f">비밀번호<input name="password" type="password" maxlength="64" required autocomplete="off" placeholder="글 쓸 때 정한 비밀번호"></label><label class="f">별점<select name="v">${vOpts(r.v)}</select></label></div>
            <label class="f">내용<textarea name="text" maxlength="500">${esc(r.text)}</textarea></label>
            <div class="row"><button class="btn pri sm" type="submit">저장</button><button class="btn sm" type="button" data-bcancel>취소</button></div></form>`
        : `${r.v ? `<div class="rateline">${starsView(r.v, true)}<b class="num">${r.v.toFixed(1)}</b></div>` : ''}${r.text ? `<p class="revtxt">${esc(r.text)}</p>` : ''}`;
      const del = mode === 'delete'
        ? `<form class="bform inline" data-bdel-form="${esc(r.id)}"><input name="password" type="password" maxlength="64" required autocomplete="off" placeholder="비밀번호 (관리자는 관리자 비밀번호)" aria-label="비밀번호"><button class="btn danger sm" type="submit">삭제</button><button class="btn sm" type="button" data-bcancel>취소</button></form>` : '';
      return `<article class="rev board${r.admin ? ' adm' : ''}">
        <div class="revh"><b class="who">${esc(r.name)}</b>${fmtWhen(r)}</div>
        ${withTea && t ? `<button class="revtea" data-open="${esc(t.id)}"><span class="dot" style="background:${colorOf(t)}"></span><b>${esc(t.nameKo)}</b>${t.originalName ? `<span class="han" lang="zh">${esc(t.originalName)}</span>` : ''}<span class="faint">${esc(catOf(t).ko)}</span></button>` : ''}
        ${body}${del}
        ${mode ? '' : `<div class="bact"><button class="lnk" data-bedit="${esc(r.id)}">수정</button><button class="lnk" data-bdel="${esc(r.id)}">삭제</button></div>`}
      </article>`;
    }
    /* 이 차에 대한 다른 사람들의 리뷰: 게시판 글 + 불러온 기록(관리자·친구). 내 기기 기록은 '나의 평가'에 따로 있음 */
    const teaEntries = (teaId) => reviewEntries().out.filter((e) => !e.me && e.t.id === teaId).sort((a, b) => b.time - a.time);
    function stats(teaId) {
      const es = teaEntries(teaId), vs = es.filter((e) => e.r).map((e) => e.r.v);
      const dist = [0, 0, 0, 0, 0, 0]; vs.forEach((v) => dist[Math.min(5, Math.max(1, Math.round(v)))]++);
      return { es, n: es.length, rated: vs.length, avg: vs.length ? vs.reduce((a, v) => a + v, 0) / vs.length : 0, dist };
    }
    function avgLine(teaId) {
      const s = stats(teaId);
      return `<button class="avgline" data-jump="d-board">${s.rated ? `${starsView(s.avg, true)}<b class="num">${s.avg.toFixed(1)}</b><span>리뷰 ${s.n}개</span>` : `<span>${s.n ? '리뷰 ' + s.n + '개' : '아직 리뷰가 없습니다 · 첫 리뷰 쓰기'}</span>`}</button>`;
    }
    function summaryHtml(s) {
      if (!s.n) return '';
      const max = Math.max(1, ...s.dist);
      return `<div class="rsum"><div class="rsum-big"><b class="num">${s.rated ? s.avg.toFixed(1) : '—'}</b>${s.rated ? starsView(s.avg, true) : ''}<small>리뷰 ${s.n}개${s.rated !== s.n ? ` · 별점 ${s.rated}개` : ''}</small></div>
        <div class="rsum-bars">${[5, 4, 3, 2, 1].map((k) => `<div class="rb"><span>${k}점</span><i><em style="width:${(s.dist[k] / max) * 100}%"></em></i><span class="num">${s.dist[k]}</span></div>`).join('')}</div></div>`;
    }
    function recCard(e) { /* 불러온 기록(관리자·친구)의 리뷰: 게시판 글이 아니라 수정·삭제 버튼 없음 */
      return `<article class="rev">
        <div class="revh"><b class="who">${esc(e.who)}</b>${e.time ? `<time datetime="${new Date(e.time).toISOString()}" title="${esc(new Date(e.time).toLocaleString('ko-KR'))}">${new Date(e.time).toLocaleDateString('ko-KR')} · ${ago(e.time)}</time>` : ''}</div>
        ${e.r ? `<div class="rateline">${starsView(e.r.v, true)}<b class="num">${e.r.v.toFixed(1)}</b></div>` : ''}${e.n ? `<p class="revtxt">${esc(e.n.text)}</p>` : ''}
      </article>`;
    }
    function teaHtml(teaId) {
      const s = stats(teaId);
      const list = s.es.map((e) => (e.board ? cardHtml(e.board, false) : recCard(e))).join('');
      const empty = st.err && BOARD_URL && !st.list.length && !list ? `<div class="empty">${esc(st.err)}</div>` : BOARD_URL && !st.loaded && !list ? '<p class="muted">리뷰를 불러오는 중…</p>' : '<div class="empty">아직 이 차의 리뷰가 없습니다. 첫 리뷰를 남겨 보세요.</div>';
      if (!BOARD_URL) return summaryHtml(s) + `<div class="blist">${list || '<div class="empty">리뷰 게시판 서버가 아직 연결되지 않았습니다.</div>'}</div>`;
      return summaryHtml(s) + `<form class="bform" data-bform="${esc(teaId)}">
          <div class="bf-row"><label class="f">닉네임<input type="text" name="name" maxlength="20" value="${esc(nick())}" autocomplete="off"></label><label class="f">비밀번호<input name="password" type="password" maxlength="64" required autocomplete="new-password" placeholder="4자 이상"></label><label class="f">별점<select name="v">${vOpts(null)}</select></label></div>
          <label class="f">내용<textarea name="text" maxlength="500" placeholder="이 차 어땠나요?"></textarea></label>
          <div class="row"><button class="btn pri" type="submit" ${st.busy ? 'disabled' : ''}>리뷰 등록</button><span class="faint" style="font-size:12.5px">비밀번호는 글을 고치거나 지울 때 씁니다. 잊으면 되찾을 수 없습니다.</span></div>
        </form>
        <div class="blist">${list || empty}</div>`;
    }
    function nickHtml() {
      return `<section class="sec"><div class="sec-h"><h2>리뷰 닉네임</h2></div>
        <p style="font-size:14px;max-width:70ch;margin:0 0 10px">리뷰 게시판에 글을 쓸 때 보이는 이름입니다. 처음에는 "차갤러"이고, 글을 쓸 때마다 비밀번호를 정해서 나중에 그 비밀번호로 고치거나 지웁니다.</p>
        <form class="row" data-nick-form style="max-width:420px;flex-wrap:nowrap"><input type="text" id="nick" maxlength="20" style="flex:1;min-width:0" value="${esc(nick())}"><button class="btn pri" type="submit">저장</button></form></section>`;
    }
    async function submit(e) {
      const f = e.target;
      const nf = f.closest('[data-nick-form]');
      if (nf) { e.preventDefault(); const n = setNick($('#nick').value); $('#nick').value = n; toast('닉네임을 "' + n + '"(으)로 저장했습니다.'); return true; }
      const add = f.closest('[data-bform]'), ed = f.closest('[data-bedit-form]'), del = f.closest('[data-bdel-form]');
      if (!add && !ed && !del) return false;
      e.preventDefault();
      if (st.busy) return true;
      const fd = new FormData(f), g = (k) => (fd.get(k) == null ? '' : String(fd.get(k)));
      if (g('password').length < 4) { toast('비밀번호는 4자 이상으로 입력하십시오.'); return true; }
      st.busy = true; $$('button[type=submit]', f).forEach((b) => (b.disabled = true));
      try {
        if (add) {
          const name = setNick(g('name'));
          const j = await call('/reviews', { teaId: add.dataset.bform, name, password: g('password'), v: g('v') ? +g('v') : 0, text: g('text') });
          st.list.push(j.review); toast('리뷰를 등록했습니다.');
        } else if (ed) {
          const j = await call('/reviews/' + ed.dataset.beditForm + '/edit', { password: g('password'), v: g('v') ? +g('v') : 0, text: g('text') });
          st.list = st.list.map((r) => (r.id === j.review.id ? j.review : r)); st.edit = null; toast('리뷰를 고쳤습니다.');
        } else {
          const id = del.dataset.bdelForm;
          await call('/reviews/' + id + '/delete', { password: g('password') });
          st.list = st.list.filter((r) => r.id !== id); st.edit = null; toast('리뷰를 지웠습니다.');
        }
        st.busy = false; if (document.activeElement) document.activeElement.blur(); draw(true);
      } catch (err) {
        st.busy = false; $$('button[type=submit]', f).forEach((b) => (b.disabled = false)); toast(err.message);
      }
      return true;
    }
    function click(t) {
      const be = t.closest('[data-bedit]'), bd = t.closest('[data-bdel]');
      if (be || bd) { st.edit = { id: (be || bd).dataset[be ? 'bedit' : 'bdel'], mode: be ? 'edit' : 'delete' }; draw(true); const i = $('.rev.board input[name=password]'); if (i) i.focus(); return true; }
      if (t.closest('[data-bcancel]')) { st.edit = null; draw(true); return true; }
      if (t.closest('[data-bload]')) { load(); toast('새로 불러오는 중…'); return true; }
      return false;
    }

    /* ── 관리자 리뷰 관리 (#admin, 메뉴에는 없음). 비밀번호는 이 탭의 sessionStorage에만 보관 ── */
    const AKEY = 'darok-admin';
    const adm = { sel: new Set(), busy: false };
    const apw = () => { try { return sessionStorage.getItem(AKEY) || ''; } catch (e) { return ''; } };
    const setApw = (v) => { try { v ? sessionStorage.setItem(AKEY, v) : sessionStorage.removeItem(AKEY); } catch (e) {} };
    function adminHtml() {
      if (!BOARD_URL) return '<h1 style="font-size:28px">리뷰 관리</h1><div class="empty">리뷰 게시판 서버가 연결되지 않았습니다.</div>';
      if (!apw()) return `<h1 style="font-size:28px">리뷰 관리</h1><p class="muted" style="margin:6px 0 18px">관리자 비밀번호를 넣으면 게시판 리뷰를 모아 보고 지울 수 있습니다. 이 탭을 닫으면 다시 로그인해야 합니다.</p>
        <form class="row" data-admin-login style="max-width:420px;flex-wrap:nowrap"><input type="password" id="admin-pw" style="flex:1;min-width:0" autocomplete="current-password" placeholder="관리자 비밀번호" aria-label="관리자 비밀번호"><button class="btn pri" type="submit">로그인</button></form>`;
      const list = st.list.slice().sort((a, b) => b.t - a.t);
      for (const id of [...adm.sel]) if (!list.some((r) => r.id === id)) adm.sel.delete(id);
      const today = list.filter((r) => Date.now() - r.t < 86400000).length;
      const row = (r) => { const t = tea(r.teaId);
        return `<div class="arow" data-arow="${esc(r.id)}" data-find="${esc((r.name + ' ' + r.text + ' ' + (t ? t.nameKo : '')).toLowerCase())}">
          <input type="checkbox" data-admin-sel="${esc(r.id)}" ${adm.sel.has(r.id) ? 'checked' : ''} aria-label="선택">
          <div style="min-width:0"><div class="revh"><b class="who">${esc(r.name)}${r.admin ? ' <span class="pill user">관리자</span>' : ''}</b><time>${esc(new Date(r.t).toLocaleString('ko-KR'))}${r.edited ? ' · 수정됨' : ''}</time></div>
          ${t ? `<button class="revtea" data-open="${esc(t.id)}"><span class="dot" style="background:${colorOf(t)}"></span><b>${esc(t.nameKo)}</b></button>` : `<span class="faint">알 수 없는 차 (${esc(r.teaId)})</span>`}
          ${r.v ? `<div class="rateline">${starsView(r.v, true)}<b class="num">${r.v.toFixed(1)}</b></div>` : ''}${r.text ? `<p class="revtxt">${esc(r.text)}</p>` : ''}</div>
          <button class="btn danger sm" data-admin-del="${esc(r.id)}">삭제</button></div>`; };
      return `<h1 style="font-size:28px">리뷰 관리</h1>
        <div class="statline" style="margin:14px 0 6px"><div class="s"><b class="num">${list.length}</b><span>게시판 리뷰</span></div><div class="s"><b class="num">${today}</b><span>최근 24시간</span></div><div class="s"><b class="num">${new Set(list.map((r) => r.name)).size}</b><span>닉네임</span></div></div>
        <div class="abar"><input type="search" id="admin-q" placeholder="닉네임·내용·차 이름 검색" aria-label="리뷰 검색" autocomplete="off">
          <button class="btn sm" data-admin-all>${adm.sel.size && adm.sel.size === list.length ? '선택 해제' : '전체 선택'}</button>
          <button class="btn danger sm" data-admin-delsel ${adm.sel.size ? '' : 'disabled'}>선택 삭제 ${adm.sel.size ? `<span class="num">${adm.sel.size}</span>` : ''}</button>
          <button class="btn sm" data-bload>새로고침</button><button class="btn ghost sm" data-admin-out>로그아웃</button></div>
        <div class="alist">${st.err && !list.length ? `<div class="empty">${esc(st.err)}</div>` : !st.loaded ? '<p class="muted">불러오는 중…</p>' : list.length ? list.map(row).join('') : '<div class="empty">게시판 리뷰가 없습니다.</div>'}</div>
        <p class="disclaim">여기서 지우는 건 게시판 리뷰만입니다. 관리자 기록 파일과 친구 기록은 각자의 GitHub 파일에서 관리합니다. 지운 리뷰는 되돌릴 수 없습니다.</p>`;
    }
    function mountAdmin() {
      const q = $('#admin-q'); if (!q) return;
      q.addEventListener('input', () => { const v = q.value.trim().toLowerCase(); $$('[data-arow]').forEach((el) => (el.hidden = !!v && !el.dataset.find.includes(v))); });
    }
    async function adminDelete(ids) {
      if (adm.busy || !ids.length) return;
      if (!confirm(ids.length === 1 ? '이 리뷰를 지울까요? 되돌릴 수 없습니다.' : `리뷰 ${ids.length}개를 지울까요? 되돌릴 수 없습니다.`)) return;
      adm.busy = true; let ok = 0, fail = '';
      for (const id of ids) {
        try { await call('/reviews/' + id + '/delete', { password: apw() }); st.list = st.list.filter((r) => r.id !== id); adm.sel.delete(id); ok++; }
        catch (e) { if (/이미 지워진/.test(e.message)) { st.list = st.list.filter((r) => r.id !== id); adm.sel.delete(id); continue; } fail = e.message; break; }
      }
      adm.busy = false; draw(true);
      toast(fail ? `${ok}개를 지웠고, 나머지는 실패했습니다: ${fail}` : `리뷰 ${ok}개를 지웠습니다.`);
      if (/비밀번호/.test(fail)) { setApw(''); draw(true); }
    }
    async function adminLogin(e) {
      e.preventDefault(); const pw = ($('#admin-pw').value || '');
      if (!pw) return;
      try { await call('/admin/check', { password: pw }); setApw(pw); adm.sel.clear(); if (!st.loaded) load(); draw(true); toast('관리자로 로그인했습니다.'); }
      catch (err) { toast(err.message); }
    }
    function adminClick(t) {
      const d = t.closest('[data-admin-del]'); if (d) { adminDelete([d.dataset.adminDel]); return true; }
      if (t.closest('[data-admin-delsel]')) { adminDelete([...adm.sel]); return true; }
      if (t.closest('[data-admin-all]')) { if (adm.sel.size && adm.sel.size === st.list.length) adm.sel.clear(); else st.list.forEach((r) => adm.sel.add(r.id)); draw(true); return true; }
      if (t.closest('[data-admin-out]')) { setApw(''); adm.sel.clear(); draw(true); toast('로그아웃했습니다.'); return true; }
      const c = t.closest('[data-admin-sel]'); if (c) { c.checked ? adm.sel.add(c.dataset.adminSel) : adm.sel.delete(c.dataset.adminSel); const b = $('[data-admin-delsel]'); if (b) { b.disabled = !adm.sel.size; b.innerHTML = '선택 삭제 ' + (adm.sel.size ? `<span class="num">${adm.sel.size}</span>` : ''); } return true; }
      return false;
    }
    return { load, teaHtml, avgLine, cardHtml, nickHtml, submit, click, adminHtml, mountAdmin, adminLogin, adminClick, list: () => st.list, on: () => !!BOARD_URL };
  })();

  /* ───────── 시작 ───────── */
  async function boot() {
    await Store.init();
    const [r, f, u, st, bw] = await Promise.all([Store.get('ratings'), Store.get('favorites'), Store.get('userTeas'), Store.get('settings'), Store.get('brewed')]);
    S.brewed = bw && typeof bw === 'object' ? bw : {};
    const nt = await Store.get('notes'); S.notes = nt && typeof nt === 'object' ? nt : {};
    const tb = await Store.get('tomb'); S.tomb = tb && typeof tb === 'object' ? tb : {};
    S.ratings = r && typeof r === 'object' ? r : {}; S.favorites = f && typeof f === 'object' ? f : {};
    S.userTeas = {}; if (u && typeof u === 'object') for (const [id, x] of Object.entries(u)) S.userTeas[id] = sanitizeUserTea(Object.assign({}, x, { id }));
    if (st && typeof st === 'object') S.settings = Object.assign(S.settings, st, { brewEdits: st.brewEdits || {} });
    try { const ks = await Store.keys('images'); for (const k of ks) { const v = await Store.get(k, 'images'); if (v) S.images[k] = v; } } catch (e) {}
    applyTheme(); rebuild();
    document.addEventListener('click', onClick); document.addEventListener('keydown', onKey); document.addEventListener('submit', onSubmit); document.addEventListener('change', onChange);
    const h = (location.hash || '').slice(1);
    if (['catalog', 'mine', 'log', 'reviews', 'knowledge', 'settings', 'admin'].includes(h)) S.view = { name: h };
    else if (h && D.byIdAll[h]) S.view = { name: 'detail', id: h };
    render();
    Sync.loadShared();
    Board.load();
    window.addEventListener('hashchange', () => { const k = location.hash.slice(1); if (D.byIdAll[k]) go('detail', { id: k }); else if (['catalog', 'mine', 'log', 'reviews', 'knowledge', 'settings', 'home', 'admin'].includes(k)) go(k); });
    if (D.errors.length) console.warn('[알록다록 데이터 점검]', D.errors);
  }
  boot();
})();
</script>
